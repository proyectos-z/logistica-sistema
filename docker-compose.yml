services:

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "3001:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,PLAINTEXT_HOST://localhost:3001
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - logistica-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      start_period: 90s
      interval: 20s
      timeout: 15s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "3002:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: logistica-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - logistica-network

  tarifa-service:
    build:
      context: .
      dockerfile: tarifa-service/Dockerfile
    image: tarifa-service:latest
    container_name: tarifa-service
    restart: unless-stopped
    ports:
      - "3003:8082"
    networks:
      - logistica-network

  envio-service:
    build:
      context: .
      dockerfile: envio-service/Dockerfile
    image: envio-service:latest
    container_name: envio-service
    restart: unless-stopped
    ports:
      - "3004:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TARIFA_SERVICE_URL: http://tarifa-service:8082
    depends_on:
      kafka:
        condition: service_started
      tarifa-service:
        condition: service_started
    networks:
      - logistica-network

  notificacion-service:
    build:
      context: .
      dockerfile: notificacion-service/Dockerfile
    image: notificacion-service:latest
    container_name: notificacion-service
    restart: unless-stopped
    ports:
      - "3005:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - logistica-network

networks:
  logistica-network:
    driver: bridge
